<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TEGSA CAE — Vista previa (sin instalar)</title>
<style>
/* Mismos tokens que el design system del scaffold */
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#eceef1;--ink:#1b2430;--ink-soft:#5b6676;
  --line:#d4d9e0;--accent:#1f6feb;--accent-soft:#e7f1fb;--grid:#e3e7ec;--wire:#1b2430;
  --symbol:#1b2430;--pin:#1f6feb;--radius:8px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141b;--surface:#161c25;--surface-2:#1d2531;--ink:#e6ebf1;--ink-soft:#9aa6b4;
  --line:#2a333f;--accent:#4d9bff;--accent-soft:#15283f;--grid:#1c242f;--wire:#cbd4df;
  --symbol:#cbd4df;--pin:#4d9bff;
}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg)}
.app{display:flex;flex-direction:column;height:100%}
.ribbon{background:var(--accent-soft);color:var(--accent);font-size:12.5px;
  padding:6px 12px;border-bottom:1px solid var(--line);text-align:center}
.toolbar{display:flex;align-items:center;gap:16px;padding:8px 12px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.5px}.brand span{color:var(--accent)}
.group{display:flex;gap:6px}.meta{margin-left:auto;color:var(--ink-soft);font-size:13px}
.btn{font:inherit;font-size:13px;padding:6px 12px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.tool.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.body{flex:1;display:grid;grid-template-columns:240px 1fr 260px;min-height:0}
.sidebar{background:var(--surface);overflow:auto;padding:12px}
.sidebar.left{border-right:1px solid var(--line)}.sidebar.right{border-left:1px solid var(--line)}
.sidebar h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:13px}
.stage{position:relative;overflow:auto;background:var(--bg)}
.palette-group h4{margin:14px 0 6px;font-size:13px}
.palette-item{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;width:100%;
  text-align:left;margin-bottom:4px;padding:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;color:var(--ink)}
.palette-item:hover{border-color:var(--accent)}
.palette-item .thumb{width:34px;height:34px;grid-row:span 2;color:var(--symbol)}
.palette-code{font-family:var(--mono);font-size:12px;font-weight:600}
.palette-family{font-size:11px;color:var(--ink-soft)}
#inspector h4{margin:0 0 2px;font-family:var(--mono)}
.attrs{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.attrs td{padding:3px 4px;border-bottom:1px solid var(--line)}.attrs td:first-child{color:var(--ink-soft)}
.price{margin-top:10px;font-size:13px;font-weight:600}
.statusbar{padding:5px 12px;background:var(--surface);border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-soft)}
.schematic{display:block;width:100%;height:100%;background:var(--surface)}
.schematic .grid line{stroke:var(--grid);stroke-width:1}
.schematic .wire{fill:none;stroke:var(--wire);stroke-width:2}
.schematic .wire.preview{stroke-dasharray:5 4;opacity:.6}
.schematic .device{cursor:grab;color:var(--symbol)}
.schematic .pin{fill:var(--pin);stroke:none}
.schematic .rds{fill:var(--ink);font:600 11px var(--mono)}
.schematic .sel-box{fill:none;stroke:var(--accent);stroke-dasharray:4 3}
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">Vista previa de la fase F0 — abierta sin instalar. Clic en un artículo y luego en la hoja para colocarlo · <b>W</b> cable · <b>V</b> seleccionar · <b>Supr</b> borrar.</div>
  <header class="toolbar">
    <div class="brand">TEGSA <span>CAE</span></div>
    <div class="group">
      <button class="btn" id="act-clear">Vaciar</button>
      <button class="btn" id="act-demo">Cargar demo</button>
    </div>
    <div class="group">
      <button class="btn tool active" id="tool-select" title="Seleccionar / mover (V)">Seleccionar</button>
      <button class="btn tool" id="tool-wire" title="Cablear (W)">Cable</button>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="body">
    <aside class="sidebar left"><h3>Artículos — ACME Electric</h3><div id="palette"></div></aside>
    <main class="stage"><div id="canvas" style="width:100%;height:100%"></div></main>
    <aside class="sidebar right"><h3>Inspector</h3><div id="inspector"><p class="muted">Nada seleccionado.</p></div></aside>
  </div>
  <footer class="statusbar"><span id="status">Listo</span></footer>
</div>

<script>
"use strict";
var SVG="http://www.w3.org/2000/svg",GRID=20,W=1600,H=1000;

/* ---- símbolos del plugin de ejemplo (embebidos) ---- */
var SYMBOLS={
  contactor:{w:40,h:60,pins:[[8,0],[20,0],[32,0],[8,60],[20,60],[32,60]],
    svg:'<rect x="2" y="2" width="36" height="56" rx="2" stroke="currentColor" fill="none" stroke-width="1.2" stroke-dasharray="4 3"/>'+
        '<g stroke="currentColor" fill="none" stroke-width="2">'+
        '<line x1="8" y1="0" x2="8" y2="22"/><line x1="8" y1="38" x2="8" y2="60"/><line x1="8" y1="22" x2="15" y2="37"/>'+
        '<line x1="20" y1="0" x2="20" y2="22"/><line x1="20" y1="38" x2="20" y2="60"/><line x1="20" y1="22" x2="27" y2="37"/>'+
        '<line x1="32" y1="0" x2="32" y2="22"/><line x1="32" y1="38" x2="32" y2="60"/><line x1="32" y1="22" x2="39" y2="37"/>'+
        '<line x1="15" y1="30" x2="39" y2="30" stroke-width="1" stroke-dasharray="3 2"/></g>'},
  breaker:{w:40,h:60,pins:[[8,0],[20,0],[32,0],[8,60],[20,60],[32,60]],
    svg:'<g stroke="currentColor" fill="none" stroke-width="2">'+
        '<line x1="8" y1="0" x2="8" y2="22"/><rect x="3" y="22" width="10" height="16"/><line x1="8" y1="38" x2="8" y2="60"/>'+
        '<line x1="20" y1="0" x2="20" y2="22"/><rect x="15" y="22" width="10" height="16"/><line x1="20" y1="38" x2="20" y2="60"/>'+
        '<line x1="32" y1="0" x2="32" y2="22"/><rect x="27" y="22" width="10" height="16"/><line x1="32" y1="38" x2="32" y2="60"/>'+
        '<line x1="8" y1="30" x2="32" y2="30" stroke-width="1" stroke-dasharray="3 2"/></g>'},
  motor:{w:40,h:44,pins:[[8,0],[20,0],[32,0]],
    svg:'<g stroke="currentColor" fill="none" stroke-width="2">'+
        '<line x1="8" y1="0" x2="8" y2="11"/><line x1="20" y1="0" x2="20" y2="11"/><line x1="32" y1="0" x2="32" y2="11"/>'+
        '<circle cx="20" cy="26" r="15"/></g>'+
        '<text x="20" y="30" text-anchor="middle" fill="currentColor" stroke="none" font-size="13" font-family="monospace">M</text>'+
        '<text x="20" y="40" text-anchor="middle" fill="currentColor" stroke="none" font-size="7" font-family="monospace">3~</text>'},
  terminal:{w:20,h:20,pins:[[10,0],[10,20]],
    svg:'<g stroke="currentColor" fill="none" stroke-width="2"><line x1="10" y1="0" x2="10" y2="6"/><circle cx="10" cy="10" r="4"/><line x1="10" y1="14" x2="10" y2="20"/></g>'}
};

/* ---- artículos del plugin ---- */
var PARTS=[
  {code:"LC1D09",family:"Contactor",symbol:"contactor",price:42,attributes:{In:"9 A",Ue:"690 V",Polos:3,Bobina:"24 VDC",AC3_kW:"4 kW"}},
  {code:"LC1D18",family:"Contactor",symbol:"contactor",price:55,attributes:{In:"18 A",Ue:"690 V",Polos:3,Bobina:"24 VDC",AC3_kW:"7.5 kW"}},
  {code:"GV2ME10",family:"Interruptor",symbol:"breaker",price:48,attributes:{Tipo:"Guardamotor",Rango:"4-6.3 A",Polos:3,Icu:"100 kA"}},
  {code:"IC60N-C16",family:"Interruptor",symbol:"breaker",price:18.5,attributes:{Tipo:"Termomagnético",In:"16 A",Curva:"C",Polos:1,Icn:"6 kA"}},
  {code:"M-3K-4P",family:"Motor",symbol:"motor",price:310,attributes:{P:"3 kW",In:"6.6 A",Polos:4,rpm:1450,"Conexión":"Estrella-Triángulo"}},
  {code:"XB-2.5",family:"Borne",symbol:"terminal",price:1.2,attributes:{"Sección":"2.5 mm²",Tipo:"Tornillo",Color:"Gris"}}
];
var RDS_PREFIX={Contactor:"Q",Interruptor:"Q",Motor:"M",Borne:"X"};
function partByCode(c){for(var i=0;i<PARTS.length;i++)if(PARTS[i].code===c)return PARTS[i];return null;}

/* ---- estado ---- */
var devices=[],wires=[],sel=null,tool="select",place=null,drag=null,wirePts=[],cursor={x:0,y:0},nid=1;
function uid(){return "d"+(nid++);}
function nextRds(pfx){var n=0;for(var i=0;i<devices.length;i++){var r=devices[i].rds;if(r.indexOf("-"+pfx)===0){var k=parseInt(r.slice(pfx.length+1),10);if(!isNaN(k)&&k>n)n=k;}}return "-"+pfx+(n+1);}

var svg=document.createElementNS(SVG,"svg");
svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("class","schematic");
document.getElementById("canvas").appendChild(svg);

/* ---- utilidades ---- */
function toSvg(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();if(!m)return{x:0,y:0};var r=p.matrixTransform(m.inverse());return{x:r.x,y:r.y};}
function snap(p){return{x:Math.round(p.x/GRID)*GRID,y:Math.round(p.y/GRID)*GRID};}
function status(m){document.getElementById("status").textContent=m;}
function meta(){document.getElementById("meta").textContent=devices.length+" dispositivos · "+wires.length+" conexiones";}

/* ---- acciones ---- */
function placeDevice(part,at){
  var pfx=RDS_PREFIX[part.family]||"A";
  var d={id:uid(),rds:nextRds(pfx),code:part.code,symbol:part.symbol,x:at.x,y:at.y};
  devices.push(d);sel=d.id;render();inspector();meta();status("Colocado "+d.rds+" ("+part.code+")");
}
function finishWire(){if(wirePts.length>=2){wires.push({points:wirePts.slice()});meta();}wirePts=[];render();}
function removeSel(){if(!sel)return;devices=devices.filter(function(d){return d.id!==sel;});sel=null;render();inspector();meta();}

/* ---- eventos ---- */
svg.addEventListener("mousedown",function(e){
  var p=snap(toSvg(e));
  if(place){placeDevice(place,p);place=null;return;}
  if(tool==="wire"){wirePts.push(p);render();return;}
  var t=e.target.closest?e.target.closest("[data-id]"):null;
  if(t){var id=t.getAttribute("data-id");var d=find(id);sel=id;drag={id:id,dx:p.x-d.x,dy:p.y-d.y};inspector();}
  else{sel=null;inspector();}
  render();
});
svg.addEventListener("mousemove",function(e){
  cursor=toSvg(e);
  if(drag){var p=snap(cursor);var d=find(drag.id);d.x=p.x-drag.dx;d.y=p.y-drag.dy;render();}
  else if(tool==="wire"&&wirePts.length){render();}
});
svg.addEventListener("dblclick",finishWire);
window.addEventListener("mouseup",function(){drag=null;});
window.addEventListener("keydown",function(e){
  if(e.key==="Escape"){wirePts=[];place=null;render();}
  else if(e.key==="Enter"){finishWire();}
  else if(e.key==="Delete"||e.key==="Backspace"){removeSel();}
  else if(e.key==="w"||e.key==="W"){setTool("wire");}
  else if(e.key==="v"||e.key==="V"){setTool("select");}
});
function find(id){for(var i=0;i<devices.length;i++)if(devices[i].id===id)return devices[i];return null;}

function setTool(t){tool=t;place=null;wirePts=[];
  document.getElementById("tool-select").classList.toggle("active",t==="select");
  document.getElementById("tool-wire").classList.toggle("active",t==="wire");render();}
document.getElementById("tool-select").onclick=function(){setTool("select");};
document.getElementById("tool-wire").onclick=function(){setTool("wire");};
document.getElementById("act-clear").onclick=function(){devices=[];wires=[];sel=null;render();inspector();meta();};
document.getElementById("act-demo").onclick=loadDemo;

/* ---- render ---- */
function render(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  svg.appendChild(gridEl());
  for(var i=0;i<wires.length;i++)svg.appendChild(wireEl(wires[i].points,false));
  if(wirePts.length)svg.appendChild(wireEl(wirePts.concat([snap(cursor)]),true));
  for(var j=0;j<devices.length;j++){var g=deviceEl(devices[j]);if(g)svg.appendChild(g);}
}
function gridEl(){var g=document.createElementNS(SVG,"g");g.setAttribute("class","grid");var x,y,l;
  for(x=0;x<=W;x+=GRID){l=document.createElementNS(SVG,"line");l.setAttribute("x1",x);l.setAttribute("y1",0);l.setAttribute("x2",x);l.setAttribute("y2",H);g.appendChild(l);}
  for(y=0;y<=H;y+=GRID){l=document.createElementNS(SVG,"line");l.setAttribute("x1",0);l.setAttribute("y1",y);l.setAttribute("x2",W);l.setAttribute("y2",y);g.appendChild(l);}
  return g;}
function wireEl(pts,prev){var pl=document.createElementNS(SVG,"polyline");
  pl.setAttribute("points",pts.map(function(p){return p.x+","+p.y;}).join(" "));
  pl.setAttribute("class",prev?"wire preview":"wire");return pl;}
function deviceEl(d){var s=SYMBOLS[d.symbol];if(!s)return null;
  var g=document.createElementNS(SVG,"g");g.setAttribute("data-id",d.id);g.setAttribute("class","device");
  g.setAttribute("transform","translate("+d.x+","+d.y+")");
  var body=document.createElementNS(SVG,"g");body.innerHTML=s.svg;g.appendChild(body);
  for(var i=0;i<s.pins.length;i++){var c=document.createElementNS(SVG,"circle");
    c.setAttribute("cx",s.pins[i][0]);c.setAttribute("cy",s.pins[i][1]);c.setAttribute("r","2.5");c.setAttribute("class","pin");g.appendChild(c);}
  var tx=document.createElementNS(SVG,"text");tx.setAttribute("x",s.w+6);tx.setAttribute("y","10");tx.setAttribute("class","rds");tx.textContent=d.rds;g.appendChild(tx);
  if(d.id===sel){var b=document.createElementNS(SVG,"rect");b.setAttribute("x","-4");b.setAttribute("y","-4");
    b.setAttribute("width",s.w+8);b.setAttribute("height",s.h+8);b.setAttribute("class","sel-box");g.appendChild(b);}
  return g;}

/* ---- paleta ---- */
function buildPalette(){
  var c=document.getElementById("palette");c.innerHTML="";
  var g=document.createElement("div");g.className="palette-group";
  for(var i=0;i<PARTS.length;i++){(function(part){
    var s=SYMBOLS[part.symbol];
    var item=document.createElement("button");item.className="palette-item";
    item.title=Object.keys(part.attributes).map(function(k){return k+": "+part.attributes[k];}).join("\n");
    item.innerHTML='<svg viewBox="-4 -4 '+(s.w+8)+' '+(s.h+8)+'" class="thumb">'+s.svg+'</svg>'+
      '<span class="palette-code">'+part.code+'</span><span class="palette-family">'+part.family+'</span>';
    item.onclick=function(){setTool("select");place=part;status("Colocando "+part.code+" — clic en la hoja");};
    g.appendChild(item);
  })(PARTS[i]);}
  c.appendChild(g);
}
/* ---- inspector ---- */
function inspector(){
  var el=document.getElementById("inspector");
  if(!sel){el.innerHTML='<p class="muted">Nada seleccionado.</p>';return;}
  var d=find(sel),part=partByCode(d.code);
  var rows=part?Object.keys(part.attributes).map(function(k){return "<tr><td>"+k+"</td><td>"+part.attributes[k]+"</td></tr>";}).join(""):"";
  el.innerHTML="<h4>"+d.rds+"</h4><p class=\"muted\">ACME Electric "+d.code+"</p><table class=\"attrs\">"+rows+"</table>"+
    (part&&part.price!=null?"<p class=\"price\">Precio ref.: $"+part.price+"</p>":"");
}

/* ---- demo precargada: arranque directo de motor ---- */
function loadDemo(){
  devices=[];wires=[];sel=null;nid=1;
  placeDevice(partByCode("GV2ME10"),{x:200,y:120});   // -Q1 guardamotor
  placeDevice(partByCode("LC1D09"),{x:200,y:320});    // -Q2 contactor
  placeDevice(partByCode("M-3K-4P"),{x:200,y:560});   // -M1 motor
  sel=null;
  // alimentación superior
  wires.push({points:[[208,60],[208,120]]},{points:[[220,60],[220,120]]},{points:[[232,60],[232,120]]});
  // guardamotor -> contactor
  wires.push({points:[[208,180],[208,320]]},{points:[[220,180],[220,320]]},{points:[[232,180],[232,320]]});
  // contactor -> motor
  wires.push({points:[[208,380],[208,560]]},{points:[[220,380],[220,560]]},{points:[[232,380],[232,560]]});
  render();inspector();meta();status("Demo: arranque directo -Q1 / -Q2 / -M1");
}

/* ---- init ---- */
buildPalette();loadDemo();
</script>
</body>
</html>
